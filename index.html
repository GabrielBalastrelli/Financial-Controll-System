<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Gerenciador Financeiro</title>
    <script defer type="module" src="./app.js"></script>
  </head>
  <body>
    <div>
      <h1>Gerenciador Financeiro</h1>
      <p>Gerencie suas finanças pessoais!</p>
    </div>
    <div>
      <p id="inBalance"></p>
    </div>
    <div>
      <h3>Listas de Contas</h3>
      <div id="lstAccounts"></div>
    </div>
    <div>
      <form method="">
        <label for="inName">Nome: </label>
        <input id="inName" type="text" />
        <label for="inValue">Valor:</label>
        <input id="inValue" type="text" />
        <input id="btnSend" value="Cadastrar" type="button" />
      </form>
    </div>
  </body>
</html>
